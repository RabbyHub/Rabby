<!DOCTYPE html>
<html translate="no" class="notranslate overflow-hidden" desktop>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="google" content="notranslate" />
    <link rel="icon" href="/images/favicon-latest.png" />
    <meta
      name="viewport"
      content="initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link href="/css/Roboto+Mono+Lato.css" rel="stylesheet" />
    <link href="/css/Noto+Sans+JP.css" rel="stylesheet" />
    <title>Rabby Wallet</title>
    <style>
      /* Same layers as the bundled CSS (build/postcss-cascade-layer.js). */
      @layer properties, theme, base, legacy, components, utilities;
      @layer legacy {
        ::-webkit-scrollbar {
          background-color: transparent;
          width: 4px;
          height: 4px;
        }

        ::-webkit-scrollbar-thumb {
          background-color: var(--rb-neutral-line, #e0e5ec);
          border-radius: 1000px;
        }
      }
    </style>
    <!-- @ant-design/icons injects a copy of antd's .anticon base styles at
         runtime. Unlayered, it would beat every @layer; antd.less already has
         the same rules, so its node is pre-created and kept disabled. -->
    <style rc-util-key="@ant-design-icons" media="not all"></style>
  </head>

  <body class="h-full">
    <div id="root" class="h-full overflow-x-hidden overflow-y-auto"></div>
  </body>
</html>
