# Each PR will build preview site that help to check code is work as expect.

name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    tags:
      - '*'

jobs:
  build-pro:
    name: build pro
    runs-on: ubuntu-latest
    # TEMP experiment: compare Terser worker counts on the hosted runner
    strategy:
      fail-fast: false
      matrix:
        terser_parallel: ['', '2', '1']
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      TERSER_PARALLEL: ${{ matrix.terser_parallel }}
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.17.1'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Use NPM Token with organization read access
        uses: heisenberg-2077/use-npm-token-action@99c5b17c84a15e44fdcef6712b34b76f8f0493b0 # v1
        with:
          token: '${{ secrets.NPM_AUTH_TOKEN }}'

      - name: Install dependencies
        run: yarn install --immutable

      - name: build
        run: |
          set -o pipefail
          echo "[mem] nproc=$(nproc) $(free -m | awk '/Mem:/{print "total="$2"MB"}') $(free -m | awk '/Swap:/{print "swap_total="$2"MB"}') TERSER_PARALLEL='${TERSER_PARALLEL}'"
          (while true; do echo "[mem] $(date +%T) $(free -m | awk '/Mem:/{print "used="$3"MB avail="$7"MB"}') $(free -m | awk '/Swap:/{print "swap_used="$3"MB"}') top=$(ps -eo rss=,comm= --sort=-rss | head -1 | awk '{print $2":"int($1/1024)"MB"}')"; sleep 10; done) &
          /usr/bin/time -v yarn build:pro 2>&1 | grep -v 'Skipping instrumentation'

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ github.event_name == 'pull_request' }}
        with:
          name: Rabby_${{github.sha}}_p${{ matrix.terser_parallel }}
          path: dist
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ github.event_name == 'push' }}
        with:
          name: Rabby_${{github.ref_name}}_p${{ matrix.terser_parallel }}
          path: dist
          retention-days: 7
