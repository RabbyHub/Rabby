name: Update EIP-7702 Supported Chains

on:
  workflow_dispatch:

concurrency:
  group: update-eip7702-supported-chains
  cancel-in-progress: false

jobs:
  detect:
    name: Detect and propose EIP-7702 chains
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.17.1'
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn

      - name: Test detector
        run: |
          node --check scripts/check-eip7702.js
          node --check scripts/update-eip7702-supported-chains.js
          node --test scripts/check-eip7702.test.js
          yarn prettier --check scripts/check-eip7702.js scripts/check-eip7702.test.js scripts/update-eip7702-supported-chains.js

      - name: Detect newly supported chains
        id: detect
        run: node scripts/update-eip7702-supported-chains.js

      - name: Validate generated change
        if: steps.detect.outputs.changed == 'true'
        run: |
          yarn prettier --check src/constant/eip7702.ts
          yarn check

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          base: develop
          branch: feat/auto-eip7702-supported-chains
          delete-branch: true
          add-paths: src/constant/eip7702.ts
          commit-message: 'feat: support additional EIP-7702 chains'
          title: 'feat: support additional EIP-7702 chains'
          body: |
            This PR was generated by the manual EIP-7702 chain detection workflow.

            Newly detected chains: `${{ steps.detect.outputs.added_chains }}`

            Detection uses read-only `eth_call` state overrides against RPCs from
            `https://api.rabby.io/v1/chainrpc`, scoped to Rabby's current
            `supported_chains.json`. It verifies execution semantics at a pinned
            block, but does not independently verify type-4 transaction acceptance
            by every RPC, txpool, or sequencer.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          draft: true
