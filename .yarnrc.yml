approvedGitRepositories:
  - 'https://github.com/RabbyHub/mirror-blake2b*'

# Third-party install scripts stay off: they would run with CI secrets during
# release builds. Our own postinstall (patch-package) still runs. If a package
# truly needs its build step, allow just that one with
# `dependenciesMeta: { <name>: { built: true } }` in package.json.
enableScripts: false

nodeLinker: node-modules

npmMinimalAgeGate: 15d

yarnPath: .yarn/releases/yarn-4.14.1.cjs

npmPreapprovedPackages:
  - '@rabby-wallet/*'
  - '@debank/*'
  - 'warden-for-js'
